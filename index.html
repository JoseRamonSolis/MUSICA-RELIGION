    /* 1. CONFIGURACIÓN GENERAL DEL CONTENEDOR PRINCIPAL */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden; 
      background-color: #222222;
    }

    /* Estructura vertical: Arriba el índice, abajo el contenido dividido */
    .pantalla-completa {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* 2. MARCO SUPERIOR: "INDICE" (Buscador, Abecedario y Botones) */
    .marco-indice {
      background-color: #800080;
      padding: 8px 15px;
      border-bottom: 2px solid #ccc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 10;
    }

    .marco-indice h3 {
      margin: 0 0 6px 0;
      color: #DCDCDC;
      font-size: 26px;
      text-align: center;
    }

    .seccion-botones {
      margin-bottom: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      align-items: center;
    }

    .caja-busqueda {
      width: 300px; 
      padding: 5px 10px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .caja-busqueda:focus {
      border-color: #0066cc;
      outline: none;
    }

    .selector-etiquetas {
      padding: 4px 6px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background-color: white;
    }

    button {
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 3px;
      background-color: white;
      color: #333;
    }

    button:hover, button.activo {
      background-color: #0066cc;
      color: white;
      border-color: #0066cc;
    }

    .boton-ordenar {
      background-color: #28a745;
      color: white;
      border-color: #28a745;
    }

    /* 3. PARTE INFERIOR DIVIDIDA: "LISTA" (Izquierda) y "LETRA" (Derecha) */
    .seccion-inferior {
      display: flex;
      flex-grow: 1;
      height: calc(100% - 90px); 
    } 

    /* MARCO IZQUIERDO: "LISTA" (Ultra compacto, solo títulos de canciones) */
    .marco-lista {
      width: 280px;
      min-width: 280px;
      background-color: #DCDDD9;
      border-right: 2px solid #ddd;
      overflow-y: auto; 
      padding: 6px;
      box-sizing: border-box;
    }

    .lista-canciones {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .item-cancion {
      background: white;
      margin-bottom: 4px;
      border-radius: 3px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border-bottom: 1px solid #eee;
    }

    .item-cancion:hover {
      background-color: #e6f2ff;
    }

    /* Enlace que inyecta la letra en el iframe derecho */
    .item-cancion a {
      text-decoration: none;
      display: block;
      padding: 6px 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .titulo-cancion {
      font-size: 13px;
      font-weight: bold;
      color: #0066cc;
    }

    .artista-cancion {
      font-size: 12px;
      color: #666;
      margin-left: 5px;
    }

    /* MARCO DERECHO: "LETRA" (Visor de las partituras) */
    .marco-letra {
      flex-grow: 1;
      height: 100%;
      border: none;
      background-color: #ebebeb; 
    }
  </style>

    // Dibuja los resultados en el panel "LISTA" de la izquierda
    function renderizarLista(lista) {
      var ul = document.getElementById("lista-canciones-ui");
      ul.innerHTML = ""; 

      if (lista.length === 0) {
        ul.innerHTML = '<li style="padding:10px; color:#999; font-size:12px; text-align:center;">No hay resultados.</li>';
        return;
      }

      lista.forEach(function(cancion) {
        var li = document.createElement("li");
        li.className = "item-cancion";
        
        // Estructura de texto limpia para evitar fallos de lectura en local
        li.innerHTML = '<a href="' + cancion.archivo + '" target="letra" title="' + cancion.titulo + ' - ' + cancion.artista + '">' +
                       '<span class="titulo-cancion">' + cancion.titulo + '</span>' +
                       '<span class="artista-cancion">- ' + cancion.artista + '</span>' +
                       '</a>';
        ul.appendChild(li);
      });
    }

    // Lógica del Buscador Inteligente por texto y etiquetas ocultas
    function buscarPorTexto() {
      var textoBuscado = document.getElementById("buscador-texto").value.trim().toLowerCase();
      var categoriaSeleccionada = document.getElementById("filtro-categoria").value;
      
      var baseFiltrado = canciones;
      
      if (letraFiltroActual) {
        baseFiltrado = baseFiltrado.filter(function(c) {
          return c.titulo.trim().toUpperCase().indexOf(letraFiltroActual) === 0;
        });
      }

      if (categoriaSeleccionada) {
        baseFiltrado = baseFiltrado.filter(function(cancion) {
          return cancion.etiquetas.indexOf(categoriaSeleccionada) !== -1;
        });
      }

      cancionesFiltradas = baseFiltrado.filter(function(cancion) {
        var tituloMatch = cancion.titulo.toLowerCase().indexOf(textoBuscado) !== -1;
        var artistaMatch = cancion.artista.toLowerCase().indexOf(textoBuscado) !== -1;
        var etiquetaMatch = cancion.etiquetas.some(function(tag) {
          return tag.indexOf(textoBuscado) !== -1;
        });
        
        return tituloMatch || artistaMatch || etiquetaMatch;
      });

      renderizarLista(cancionesFiltradas);
    }

    function filtrarPorCategoria() {
      buscarPorTexto();
    }

    function ordenarAlfabeticamente() {
      cancionesFiltradas.sort(function(a, b) {
        return a.titulo.localeCompare(b.titulo);
      });
      renderizarLista(cancionesFiltradas);
    }

    function filtrarPorLetra(letra, botonPresionado) {
      document.querySelectorAll("#contenedor-abecedario button").forEach(function(b) {
        b.classList.remove("activo");
      });
      botonPresionado.classList.add("activo");
      letraFiltroActual = letra;
      buscarPorTexto();
    }

    function mostrarTodas() {
      document.querySelectorAll("#contenedor-abecedario button").forEach(function(b) {
        b.classList.remove("activo");
      });
      document.getElementById("buscador-texto").value = ""; 
      document.getElementById("filtro-categoria").value = ""; 
      letraFiltroActual = "";
      cancionesFiltradas = canciones.slice();
      renderizarLista(cancionesFiltradas);
    }

    // Inicialización del sistema al cargar la página
    window.onload = function() {
      renderizarLista(canciones);
    };
    function abrirPaginaAutor() {
  var selector = document.getElementById("filtro-autor");
  var archivoAutor = selector.value;

  if (archivoAutor !== "") {
    // El comando "_blank" es el truco para obligar al PC a abrir otra pestaña limpia
    window.open(archivoAutor, "_blank");
    
    // Resetea el menú para que vuelva a mostrar el título principal
    selector.value = "";
  }
}
  </script>
